name: Build apps

# Every push builds and smoke-tests the apps. Pushing a tag like v2.0.0 publishes
# them as a GitHub Release (uploaded straight to the release, no artifact storage).
#   macOS:   universal (Apple Silicon + Intel) .app in a .dmg
#   Windows: MSI installer with an onedir app and stable helper paths
#   Linux:   AppImage (own Qt window, X11 + Wayland), plus a one-release .tar.gz holding the same file

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Clone Hero Companion $GITHUB_REF_NAME" --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)

  macos:
    needs: [test, release]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: macos-15
    env:
      PY: /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12
      ASSET: CloneHeroCompanion-macOS-universal.dmg
    steps:
      - uses: actions/checkout@v5
      - name: Install universal2 Python from python.org
        run: |
          curl -sSL -o py.pkg https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg py.pkg -target /
          $PY -c "import platform,sys; print(sys.version, platform.machine())"
          lipo -archs "$($PY -c 'import sys; print(sys.executable)')"
      - name: Install dependencies (universal2)
        run: |
          $PY -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip wheel
          pip install pyinstaller delocate pillow "yt-dlp>=2026.8.19" yt-dlp-ejs certifi send2trash pywebview
          # numpy has no universal2 wheel: fuse the arm64 and x86_64 wheels
          mkdir -p wheels/arm wheels/x86 wheels/fused
          pip download numpy==2.2.6 --no-deps --only-binary=:all: --platform macosx_11_0_arm64 -d wheels/arm
          pip download numpy==2.2.6 --no-deps --only-binary=:all: --platform macosx_10_13_x86_64 -d wheels/x86
          delocate-merge wheels/arm/*.whl wheels/x86/*.whl -w wheels/fused
          pip install wheels/fused/*.whl
          python scripts/fuse_ffmpeg_mac.py build/bin/ffmpeg
          # Deno (pinned and SHA-256 verified in scripts/deno.lock.json) for yt-dlp's JS challenges
          python scripts/fetch_deno.py mac build/bin/deno
          python -c "import numpy, webview, yt_dlp; print('numpy', numpy.__version__)"
      - name: Build universal .app
        run: |
          source venv/bin/activate
          python scripts/make_icon.py build/icon
          iconutil -c icns build/icon/icon.iconset -o build/icon/icon.icns
          pyinstaller --noconfirm --windowed --onedir --target-arch universal2 \
            --name "Clone Hero Companion" --icon build/icon/icon.icns \
            --osx-bundle-identifier com.cr4zysh4rk.clonehero-companion \
            --add-data "chcompanion/web:chcompanion/web" \
            --add-binary "build/bin/ffmpeg:bin" \
            --add-binary "build/bin/deno:bin" \
            --add-data "packaging/licenses:licenses" \
            --collect-data yt_dlp_ejs --hidden-import yt_dlp \
            --exclude-module tkinter run.py
          APP="dist/Clone Hero Companion.app"
          PLIST="$APP/Contents/Info.plist"
          plutil -insert NSAppTransportSecurity -json '{"NSAllowsLocalNetworking":true,"NSAllowsArbitraryLoads":true}' "$PLIST"
          plutil -replace CFBundleShortVersionString -string "${GITHUB_REF_NAME#v}" "$PLIST" || true
          plutil -replace NSHighResolutionCapable -bool true "$PLIST" || plutil -insert NSHighResolutionCapable -bool true "$PLIST"
          # Ad-hoc signing without the hardened runtime: Deno's V8 JIT needs no entitlements then.
          # (If a Developer ID + --options runtime is ever added, give bin/deno
          # com.apple.security.cs.allow-jit and allow-unsigned-executable-memory.)
          DENO_BIN="$(find "$APP" -path '*bin/deno' -type f | head -1)"
          chmod +x "$DENO_BIN"
          codesign --force --sign - "$DENO_BIN"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          echo "Main executable:"; lipo -archs "$APP/Contents/MacOS/Clone Hero Companion"
          echo "numpy:"; lipo -archs "$(find "$APP" -name '_multiarray_umath*.so' | head -1)"
          echo "ffmpeg:"; lipo -archs "$(find "$APP" -path '*bin/ffmpeg' | head -1)"
          echo "deno:"; lipo -archs "$DENO_BIN"; test -x "$DENO_BIN"
      - name: Smoke test (arm64 and x86_64 under Rosetta)
        run: |
          BIN="dist/Clone Hero Companion.app/Contents/MacOS/Clone Hero Companion"
          mkdir -p "$RUNNER_TEMP/ch/Logs" "$RUNNER_TEMP/ch/Songs/Artist - Song"
          printf '[song]\nartist = Artist\nname = Song\n' > "$RUNNER_TEMP/ch/Songs/Artist - Song/song.ini"
          "$BIN" doctor --data-dir "$RUNNER_TEMP/ch" | tee doctor.txt
          grep -q "ffmpeg      : /" doctor.txt
          grep -q "^Languages   : 9 catalogs$" doctor.txt
          grep -Eq "^JS runtime  : deno [0-9.]+ \(bundled\)" doctor.txt
          grep -q "Contents/.*/bin/deno" doctor.txt
          (softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true)
          if arch -x86_64 true 2>/dev/null; then
            arch -x86_64 "$BIN" doctor --data-dir "$RUNNER_TEMP/ch" | tee doctor-x86.txt
            grep -Eq "^JS runtime  : deno [0-9.]+ \(bundled\)" doctor-x86.txt
          else
            echo "x86_64 run not possible on this runner"
          fi
      - name: Make .dmg
        run: |
          mkdir -p dmg && cp -R "dist/Clone Hero Companion.app" dmg/ && ln -s /Applications dmg/Applications
          # hdiutil sometimes fails with "Resource busy" on GitHub's macOS runners (2.8.0): retry a few times
          for i in 1 2 3 4 5; do
            hdiutil create -volname "Clone Hero Companion" -srcfolder dmg -ov -format UDZO "$ASSET" && break
            [ "$i" = 5 ] && exit 1
            echo "hdiutil failed (attempt $i), retrying"; sleep $((i * 10))
          done
          ls -la "$ASSET"
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber

  windows:
    needs: [test, release]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    env:
      ASSET: CloneHeroCompanion-windows-x64.msi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow pywebview py7zr send2trash
      - name: Test Windows download regressions
        run: |
          python -m unittest discover -s tests -p test_windows_download.py -v
          python -m unittest discover -s tests -p test_cloud_install_batch.py -v
          python -m unittest discover -s tests -p test_job_errors.py -v
          python -m unittest discover -s tests -p test_process.py -v
          python -m unittest discover -s tests -p test_deno_bundle.py -v
          python -m unittest discover -s tests -p test_setup_access.py -v
      - name: Build
        shell: bash
        run: |
          python scripts/make_icon.py build/icon
          mkdir -p build/bin
          python -c "import imageio_ffmpeg, shutil; shutil.copy2(imageio_ffmpeg.get_ffmpeg_exe(), 'build/bin/ffmpeg.exe')"
          python scripts/fetch_deno.py windows build/bin/deno.exe
          pyinstaller --noconfirm --onedir --windowed --name CloneHeroCompanion --icon build/icon/icon.ico \
            --add-data "chcompanion/web:chcompanion/web" \
            --add-binary "build/bin/ffmpeg.exe:bin" \
            --add-binary "build/bin/deno.exe:bin" \
            --add-data "packaging/licenses:licenses" \
            --collect-data yt_dlp_ejs --exclude-module imageio_ffmpeg \
            --hidden-import yt_dlp --exclude-module tkinter run.py
      - name: Authenticate for release signing
        if: startsWith(github.ref, 'refs/tags/v') && vars.WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign app, FFmpeg and Deno
        if: startsWith(github.ref, 'refs/tags/v') && vars.WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.WINDOWS_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\dist\CloneHeroCompanion\CloneHeroCompanion.exe
            ${{ github.workspace }}\dist\CloneHeroCompanion\_internal\bin\ffmpeg.exe
            ${{ github.workspace }}\dist\CloneHeroCompanion\_internal\bin\deno.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Build MSI installer
        shell: pwsh
        run: ./scripts/build_windows_msi.ps1
      - name: Sign installer
        if: startsWith(github.ref, 'refs/tags/v') && vars.WINDOWS_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.WINDOWS_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\${{ env.ASSET }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify release signatures
        if: startsWith(github.ref, 'refs/tags/v') && vars.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          foreach ($file in @($env:ASSET, 'dist/CloneHeroCompanion/CloneHeroCompanion.exe', 'dist/CloneHeroCompanion/_internal/bin/ffmpeg.exe', 'dist/CloneHeroCompanion/_internal/bin/deno.exe')) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') { throw "Invalid signature: $file" }
          }
      - name: Report signing status
        if: vars.WINDOWS_SIGNING_ENABLED != 'true'
        shell: pwsh
        run: '"Windows build is unsigned: signing has not been configured. See docs/windows-signing.md." >> $env:GITHUB_STEP_SUMMARY'
      - name: Test installed app, FFmpeg, Deno, upgrade and uninstall
        shell: pwsh
        run: ./scripts/smoke_windows.ps1 -Installer (Join-Path $pwd $env:ASSET) -PreviousInstaller (Join-Path $pwd "build/smoke-previous.msi")
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber

  linux:
    needs: [test, release]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-22.04
    env:
      ASSET: CloneHeroCompanion-linux-x86_64.AppImage
      LEGACY_ASSET: CloneHeroCompanion-linux-x64.tar.gz
      APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: System libraries
        # PyInstaller copies the X11/xcb helper libraries (not the GPU drivers) from this machine into the
        # bundle, so hosts that lack e.g. libxcb-cursor0 still work. xvfb + x11-utils are for the smoke test.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libxcb-xinerama0 libxcb-randr0 \
            libxkbcommon-x11-0 libxkbfile1 libnss3 libasound2 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libegl1 libgl1 libgbm1 libdbus-1-3 libfontconfig1 xvfb x11-utils
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r packaging/linux/requirements.txt pyinstaller py7zr send2trash pillow
      - name: Build
        run: |
          python scripts/fetch_deno.py linux build/bin/deno
          python scripts/make_icon.py build/icon
          # onedir (no per-launch unpacking); scripts/qt_excludes.py keeps unused Qt modules out of the bundle
          pyinstaller --noconfirm --onedir --console --name CloneHeroCompanion \
            --add-binary "build/bin/deno:bin" --add-data "packaging/licenses:licenses" \
            --add-data "chcompanion/web:chcompanion/web" --add-data "build/icons:icons" \
            --collect-data yt_dlp_ejs --collect-binaries imageio_ffmpeg --collect-data imageio_ffmpeg \
            --hidden-import yt_dlp --hidden-import qtpy --hidden-import PySide6.QtWebEngineWidgets \
            --hidden-import PySide6.QtWebChannel --exclude-module tkinter $(python scripts/qt_excludes.py) run.py
          curl -fsSL -o appimagetool "$APPIMAGETOOL_URL"
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 scripts/build_appimage.sh dist/CloneHeroCompanion build/icons "$ASSET" ./appimagetool
      - name: Smoke test
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          CHC_SOFTWARE_RENDER: "1"     # the runner has no GPU
        run: |
          mkdir -p "$RUNNER_TEMP/ch/Logs" "$RUNNER_TEMP/ch/Songs/Artist - Song"
          printf '[song]\nartist = Artist\nname = Song\n' > "$RUNNER_TEMP/ch/Songs/Artist - Song/song.ini"
          ls -l "$ASSET"
          # AppDir contents: desktop entry, icon, bundled deno and ffmpeg
          ./"$ASSET" --appimage-extract >/dev/null
          grep -q "^StartupWMClass=CloneHeroCompanion$" squashfs-root/CloneHeroCompanion.desktop
          grep -q "^Categories=Game;AudioVideo;$" squashfs-root/CloneHeroCompanion.desktop
          test -f squashfs-root/usr/share/icons/hicolor/256x256/apps/CloneHeroCompanion.png
          I=squashfs-root/usr/lib/CloneHeroCompanion/_internal
          test -x "$I/bin/deno"
          ls "$I"/imageio_ffmpeg/binaries/ffmpeg-* >/dev/null
          rm -rf squashfs-root
          # doctor (under a virtual display so the window backend can be probed)
          xvfb-run -a ./"$ASSET" doctor --data-dir "$RUNNER_TEMP/ch" | tee doctor.txt
          grep -q "Songs       : 1" doctor.txt
          grep -q "^Languages   : 9 catalogs$" doctor.txt
          grep -Eq "^JS runtime  : deno [0-9.]+ \(bundled\)" doctor.txt
          grep -q "^ffmpeg check: OK" doctor.txt
          grep -q "^ffmpeg media: OK" doctor.txt
          grep -q "^Window      : native (qt/xcb)" doctor.txt
          # the real window: Qt (not the browser fallback) must open and load the UI
          xvfb-run -a ./"$ASSET" run --smoke-window --no-youtube --no-browser --port 0 \
            --data-dir "$RUNNER_TEMP/ch" | tee smoke.txt
          grep -q "^SMOKE-WINDOW OK: backend=qt platform=qt/xcb" smoke.txt
          # without a display it must fail loudly (and quickly), never silently fall back
          if env -u DISPLAY -u WAYLAND_DISPLAY ./"$ASSET" run --smoke-window --no-youtube --no-browser --port 0 \
              --data-dir "$RUNNER_TEMP/ch" > nodisplay.txt 2>&1; then echo "expected a failure"; exit 1; fi
          grep -q "no display" nodisplay.txt
      - name: Legacy tar.gz
        # Kept for one release: the same AppImage as a single file, so "tar xzf; ./CloneHeroCompanion" still works.
        run: |
          mkdir legacy && cp "$ASSET" legacy/CloneHeroCompanion
          tar -C legacy -czf "$LEGACY_ASSET" CloneHeroCompanion
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ASSET" "$LEGACY_ASSET" --repo "$GITHUB_REPOSITORY" --clobber
