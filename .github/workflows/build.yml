name: Build executables

# Every push builds and smoke-tests the app on all three platforms.
# Pushing a tag like v1.2.3 also publishes the executables as a GitHub Release
# (uploaded straight to the release, so no Actions artifact storage is used).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Clone Hero Companion $GITHUB_REF_NAME" --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)

  build:
    needs: [test, release]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: CloneHeroCompanion-windows-x64.exe
          - os: macos-14
            asset: CloneHeroCompanion-macos-arm64.zip
          - os: macos-15-intel
            asset: CloneHeroCompanion-macos-x64.zip
          - os: ubuntu-22.04
            asset: CloneHeroCompanion-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --console --name CloneHeroCompanion \
            --add-data "chcompanion/web:chcompanion/web" \
            --collect-data yt_dlp_ejs \
            --hidden-import yt_dlp \
            run.py
      - name: Smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=dist/CloneHeroCompanion.exe; else BIN=dist/CloneHeroCompanion; fi
          "$BIN" --version
          mkdir -p "$RUNNER_TEMP/ch/Logs" "$RUNNER_TEMP/ch/Songs/Artist - Song"
          printf '[song]\nartist = Artist\nname = Song\n' > "$RUNNER_TEMP/ch/Songs/Artist - Song/song.ini"
          "$BIN" doctor --data-dir "$RUNNER_TEMP/ch"
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          case "$RUNNER_OS" in
            Windows) cp dist/CloneHeroCompanion.exe "out/${{ matrix.asset }}" ;;
            macOS)   chmod +x dist/CloneHeroCompanion
                     (cd dist && zip -q -X "../out/${{ matrix.asset }}" CloneHeroCompanion) ;;
            Linux)   chmod +x dist/CloneHeroCompanion
                     tar -C dist -czf "out/${{ matrix.asset }}" CloneHeroCompanion ;;
          esac
          ls -la out
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "out/${{ matrix.asset }}" --repo "$GITHUB_REPOSITORY" --clobber
